# Test config - YOLOv5 Smoke Detection | W8A8 (INT8 dynamic quant, FP32 IO) | inference (single image)
# Note: model này train với square-stretch input (conf 0.43) - letterbox làm model mất detection (conf 0.017)
# precision_format "int8" = code key for INT8-quantized weights (W8A8 dynamic: weight INT8, FP32 IO)
input_path: "/home/bht/BHT/AI/Input_Test/images/smoking-YOLO.jpg"
weight_path: "/home/bht/BHT/AI/Weights/YOLO_SmokeDetection/Yolov5s_Smoke_INT8_dynamic.onnx"
output_path: "/home/bht/Downloads/xaip-test/yolov5_smoke/w8a8/"

model_name: "yolov5"
precision_format: "int8"
dataset: "yolo_smoke"
resize_mode: "stretch"

target:
  device: "cpu"

inference_mode: true
debug_mode: false
evaluate_mode: false

tracking_option: false
display: false
