# Evaluate: YOLOv5 (object_detection, dataset=coco, 80 labels)
# Dataset: 10 COCO val images (sample) - folder must contain images/ + labels/
# Usage: python main.py config_templates/eval/yolov5_coco.yaml
input_path: "/path/to/dataset"   # folder with images/ + labels/
weight_path: "/path/to/Yolov5s_COCO-2017_FP32.onnx"
output_path: "/path/to/output"

model_name: "yolov5"
precision_format: "fp32"
dataset: "coco"

target:
  device: "cpu"

inference_mode: false
debug_mode: false
evaluate_mode: true

tracking_option: false
display: false