# Debug: yolov5 (fp32) - single image input
# Usage: python main.py config_templates/debug/yolov5.yaml
input_path: "/path/to/image"   # single image only
weight_path: "/path/to/Yolov5s_COCO-2017_FP32.onnx"
output_path: "/path/to/output"

model_name: "yolov5"
precision_format: "fp32"
dataset: "coco"

target:
  device: "cpu"

inference_mode: false
debug_mode: true
evaluate_mode: false

tracking_option: false
display: false