# Debug: vit (fp32) - single image input
# Usage: python main.py config_templates/debug/vit.yaml
input_path: "/path/to/image"   # single image only
weight_path: "/path/to/Vision_Transformer_ViT_FP32.onnx"
output_path: "/path/to/output"

model_name: "vit"
precision_format: "fp32"
dataset: "imagenet"

target:
  device: "cpu"

inference_mode: false
debug_mode: true
evaluate_mode: false

tracking_option: false
display: false