# CVF v1 Benchmark Config Example

model:
  family: yolo
  variant: yolov5
  path: models/FP32/yolov5s.onnx

task:
  type: detection
  conf_threshold: 0.3
  iou_threshold: 0.5
  dataset: coco

backend:
  type: onnxruntime

device:
  type: cpu

pipeline:
  stages:
    - preprocess
    - inference
    - adapter
    - postprocess
    - benchmark

# Benchmark specific
warmup_runs: 10
benchmark_runs: 100

output_dir: outputs/benchmark
verbose: true